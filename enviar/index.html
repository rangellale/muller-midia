<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pasta de envio</title>
<link rel="icon" href="../inicio/logo.png">
<style>
  body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;background:#000;color:#F5F3EE;
       font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;text-align:center;padding:24px 16px}
  main{max-width:420px;width:100%}
  .k{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#86868b;margin-bottom:10px}
  h1{font-size:28px;font-weight:600;margin:0 0 6px}
  p{font-size:16px;line-height:1.5;color:#a1a1a6;margin:0 0 22px}
  a.b{display:block;padding:16px 20px;border-radius:12px;text-decoration:none;font-weight:600;font-size:17px;margin-bottom:12px}
  a.drive{background:#C9A961;color:#000}
  a.voltar{border:1px solid rgba(255,255,255,.25);color:#F5F3EE}
  ol{text-align:left;color:#a1a1a6;font-size:14px;line-height:1.6;margin:26px 0 0;padding-left:20px}
</style>
</head>
<body>
<main>
  <div class="k">Pasta da vez</div>
  <h1 id="nome">PEDIDO 02</h1>
  <p>Coloque o vídeo nesta pasta e anote o número dela.</p>
  <a class="b drive" id="drive" href="https://drive.google.com/drive/folders/1xvRtHDJPjeHimk9qyIDsdZ0LMavSuZae" target="_blank" rel="noopener">Abrir a pasta no Drive</a>
  <a class="b voltar" href="https://form.jotform.com/262798736205064" id="voltar">Voltar ao formulário</a>
  <ol>
    <li>Toque em "Abrir a pasta no Drive" e solte o vídeo lá.</li>
    <li>Espere o upload terminar.</li>
    <li>Volte para o navegador e toque em "Voltar ao formulário".</li>
  </ol>
</main>
<script>
  fetch('envio.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j.url) { document.getElementById('drive').href = j.url; }
                       if (j.pasta) { document.getElementById('nome').textContent = j.pasta; } })
    .catch(function(){});
  document.getElementById('voltar').addEventListener('click', function(ev){
    // Aba aberta pelo formulario: fechar devolve a aba do formulario ja preenchido.
    window.close();
    setTimeout(function(){ location.href = 'https://form.jotform.com/262798736205064'; }, 400);
    ev.preventDefault();
  });
</script>
</body>
</html>
